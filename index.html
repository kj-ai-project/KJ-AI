<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KJ AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
  height: 100vh;
  overflow: hidden;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 800px;
  margin: auto;
}

/* HEADER */

.header {
  height: 70px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  border-bottom: 1px solid #202638;
  background: #101522;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: linear-gradient(135deg,#7c3aed,#06b6d4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 20px;
  margin-right: 12px;
}

.title {
  font-size: 19px;
  font-weight: bold;
}

.status {
  font-size: 12px;
  color: #55e68a;
  margin-top: 3px;
}

/* CHAT */

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 25px 16px 120px;
}

.welcome {
  text-align: center;
  margin-top: 60px;
}

.welcome-icon {
  width: 70px;
  height: 70px;
  margin: auto;
  border-radius: 22px;
  background: linear-gradient(135deg,#7c3aed,#06b6d4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}

.welcome h1 {
  margin-top: 20px;
  font-size: 28px;
}

.welcome p {
  margin-top: 8px;
  color: #9299aa;
}

/* MESSAGES */

.message {
  display: flex;
  margin: 15px 0;
}

.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 80%;
  padding: 13px 16px;
  border-radius: 18px;
  line-height: 1.5;
  font-size: 15px;
}

.user .bubble {
  background: #6d28d9;
  border-bottom-right-radius: 5px;
}

.ai .bubble {
  background: #171d2b;
  border: 1px solid #252c3d;
  border-bottom-left-radius: 5px;
}

/* INPUT */

.input-area {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(800px,100%);
  padding: 12px 15px 18px;
  background: linear-gradient(
    transparent,
    #0b0f19 25%
  );
}

.input-box {
  display: flex;
  align-items: center;
  background: #151b29;
  border: 1px solid #2a3245;
  border-radius: 22px;
  padding: 7px 8px 7px 15px;
  box-shadow: 0 5px 25px rgba(0,0,0,.25);
}

textarea {
  flex: 1;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 15px;
  max-height: 100px;
  padding: 8px 0;
}

textarea::placeholder {
  color: #70798c;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border: none;
  background: transparent;
  color: #9ca3b4;
  font-size: 20px;
  border-radius: 50%;
  cursor: pointer;
}

.icon-btn:hover {
  background: #242b3b;
}

.send {
  background: linear-gradient(135deg,#7c3aed,#06b6d4);
  color: white;
  font-size: 18px;
}

/* TYPING */

.typing {
  display: flex;
  gap: 4px;
}

.typing span {
  width: 6px;
  height: 6px;
  background: #9ca3af;
  border-radius: 50%;
  animation: blink 1.2s infinite;
}
