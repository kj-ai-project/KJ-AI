<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KJ AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 26px;
    }

    .header p {
      margin-top: 5px;
      color: #cbd5e1;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px 16px;
      border-radius: 15px;
      max-width: 80%;
      line-height: 1.5;
    }

    .user {
      background: #e0e7ff;
      margin-left: auto;
    }

    .ai {
      background: #f1f5f9;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #ddd;
    }

    #message {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .app {
        height: 100vh;
        border-radius: 0;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>🤖 KJ AI</h1>
      <p>My Advanced AI Assistant</p>
    </div>

    <div id="chat">
      <div class="message ai">
        👋 வணக்கம்! நான் KJ AI. என்னிடம் கேள்வி கேளுங்கள்.
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="message"
        placeholder="Ask KJ AI..."
        autocomplete="off"
      >

      <button id="sendButton" onclick="sendMessage()">
        Send
      </button>
    </div>

  </div>

  <script>
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const button = document.getElementById("sendButton");

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.innerText = text;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");

      input.value = "";
      button.disabled = true;
      button.innerText = "Sending...";

      try {
        const response = await fetch("/api/kjai", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        addMessage(data.reply, "ai");

      } catch (error) {
        addMessage(
          "❌ KJ AI-யுடன் connection-ல் பிரச்சனை ஏற்பட்டது.",
          "ai"
        );

        console.error(error);

      } finally {
        button.disabled = false;
        button.innerText = "Send";
        input.focus();
      }
    }
  </script>

</body>
</html>
